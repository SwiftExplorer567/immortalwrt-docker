        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET_VER: ${{ steps.check.outputs.latest_version }}
        run: |
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          EXISTS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ghcr.io/v2/${REPO_LOWER}/manifests/${TARGET_VER}")
          
          if [ "$EXISTS_CODE" = "200" ] || [ "$EXISTS_CODE" = "307" ]; then
            echo "Version ${TARGET_VER} already exists on GHCR. No build needed."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "New 24.x version ${TARGET_VER} found! Triggering build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger 24.x Build Workflow
        if: steps.ghcr_check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.check.outputs.latest_version }}
        run: |
          echo "==> Triggering build-and-publish.yml for 24.x version ${NEW_VER}..."
          gh workflow run build-and-publish.yml -f channel="24" -f immortalwrt_version="${NEW_VER}"

  check-v23-release:
    name: Check ImmortalWrt 23.x (LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest 23.x Version
