name: Check Upstream ImmortalWrt Releases

on:
  schedule:
    - cron: "0 1 * * *" # Daily at 01:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  check-v25-release:
    name: Check ImmortalWrt 25.x (Latest Stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest 25.x Version
        id: check
        run: |
          echo "==> Checking official ImmortalWrt download repository for 25.x..."
          LATEST_VER=$(curl -sSL https://downloads.immortalwrt.org/releases/ | \
            grep -oE 'href="25\.[0-9]+\.[0-9]+/' | \
            sed -E 's/href="([0-9]+\.[0-9]+\.[0-9]+)\//\1/' | \
            sort -V | tail -n 1)

          if [ -z "${LATEST_VER}" ]; then
            echo "Warning: No 25.x version found."
            exit 0
          fi

          echo "==> Latest 25.x Version: ${LATEST_VER}"
          echo "latest_version=${LATEST_VER}" >> $GITHUB_OUTPUT

      - name: Check if Image Exists on GHCR
        id: ghcr_check
        if: steps.check.outputs.latest_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          TARGET_VER: ${{ steps.check.outputs.latest_version }}
        run: |
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          EXISTS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ghcr.io/v2/${REPO_LOWER}/manifests/${TARGET_VER}")
          
          if [ "$EXISTS_CODE" = "200" ] || [ "$EXISTS_CODE" = "307" ]; then
            echo "Version ${TARGET_VER} already exists on GHCR. No build needed."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "New 25.x version ${TARGET_VER} found! Triggering build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger 25.x Build Workflow
        if: steps.ghcr_check.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VER: ${{ steps.check.outputs.latest_version }}
        run: |
          echo "==> Triggering build-and-publish.yml for 25.x version ${NEW_VER}..."
          gh workflow run build-and-publish.yml -f channel="stable" -f immortalwrt_version="${NEW_VER}"

  check-v24-release:
    name: Check ImmortalWrt 24.x (Modern Stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
