          NEW_VER: ${{ steps.check.outputs.latest_version }}
        run: |
          echo "==> Triggering build-and-publish.yml for 23.x version ${NEW_VER}..."
          gh workflow run build-and-publish.yml -f channel="lts" -f immortalwrt_version="${NEW_VER}"
