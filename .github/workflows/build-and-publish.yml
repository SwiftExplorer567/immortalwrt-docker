name: Build and Publish ImmortalWrt Multi-Arch Docker Image

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docker-compose.example.yml"
      - ".gitignore"
  schedule:
    - cron: "0 3 * * 0" # Weekly Sunday build
  workflow_dispatch:
    inputs:
      immortalwrt_version:
        description: "ImmortalWrt Release Version"
        required: false
        default: "23.05.4"

permissions:
  contents: read
  packages: write

env:
  DEFAULT_VERSION: "23.05.4"
  IMAGE_NAME: immortalwrt-gateway

jobs:
  build-arch-images:
    name: Build ${{ matrix.arch }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "armsr/armv8"
            arch: "arm64"
            platform: "linux/arm64"
            rootfs_name: "rootfs-armsr-armv8.tar.gz"
          - target: "x86/64"
            arch: "amd64"
            platform: "linux/amd64"
            rootfs_name: "rootfs-x86-64.tar.gz"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          TARGET_VER="${{ github.event.inputs.immortalwrt_version }}"
          if [ -z "$TARGET_VER" ] || [ "$TARGET_VER" = "auto" ]; then
            # Filter for stable tested releases (23.05.x series)
            UPSTREAM_VER=$(curl -sSL https://downloads.immortalwrt.org/releases/ | \
              grep -oE 'href="23\.05\.[0-9]+/' | \
              sed -E 's/href="([0-9]+\.[0-9]+\.[0-9]+)\//\1/' | \
              sort -V | tail -n 1)
            if [ -n "$UPSTREAM_VER" ]; then
              TARGET_VER="$UPSTREAM_VER"
            else
              TARGET_VER="${{ env.DEFAULT_VERSION }}"
            fi
          fi
          echo "==> Using ImmortalWrt Version: ${TARGET_VER}"
          echo "VERSION=${TARGET_VER}" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses5-dev libncursesw5-dev \
            zlib1g-dev gawk git gettext libssl-dev xsltproc \
            rsync wget unzip python3 zstd curl jq qemu-utils \
            genisoimage dosfstools mtools libelf-dev

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (if secrets provided)
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          else
            echo "Docker Hub credentials not configured. Skipping Docker Hub login."
          fi

      - name: Build RootFS via ImageBuilder (${{ matrix.arch }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh "${{ matrix.target }}" "${{ env.VERSION }}" "./build_output"
          cp "./build_output/${{ matrix.rootfs_name }}" "./rootfs.tar.gz"

      - name: Prepare Arch Image Tags
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAGS="ghcr.io/${REPO_LOWER}:${{ env.VERSION }}-${{ matrix.arch }},ghcr.io/${REPO_LOWER}:latest-${{ matrix.arch }}"
          if [ -n "$DH_USER" ]; then
            DH_USER_LOWER=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
            TAGS="${TAGS},${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-${{ matrix.arch }},${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch }}"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and Push Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  create-multiarch-manifest:
    name: Create & Push Multi-Arch Manifests
    needs: build-arch-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          TARGET_VER="${{ github.event.inputs.immortalwrt_version }}"
          if [ -z "$TARGET_VER" ] || [ "$TARGET_VER" = "auto" ]; then
            UPSTREAM_VER=$(curl -sSL https://downloads.immortalwrt.org/releases/ | \
              grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/' | \
              sed -E 's/href="([0-9]+\.[0-9]+\.[0-9]+)\//\1/' | \
              sort -V | tail -n 1)
            if [ -n "$UPSTREAM_VER" ]; then
              TARGET_VER="$UPSTREAM_VER"
            else
              TARGET_VER="${{ env.DEFAULT_VERSION }}"
            fi
          fi
          echo "==> Using ImmortalWrt Version: ${TARGET_VER}"
          echo "VERSION=${TARGET_VER}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (if secrets provided)
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          else
            echo "Docker Hub credentials not configured. Skipping Docker Hub login."
          fi

      - name: Create and Push Multi-Arch Manifests
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "==> Creating GHCR Multi-Arch Manifests..."
          docker buildx imagetools create -t "ghcr.io/${REPO_LOWER}:${{ env.VERSION }}" \
            "ghcr.io/${REPO_LOWER}:${{ env.VERSION }}-arm64" \
            "ghcr.io/${REPO_LOWER}:${{ env.VERSION }}-amd64"

          docker buildx imagetools create -t "ghcr.io/${REPO_LOWER}:latest" \
            "ghcr.io/${REPO_LOWER}:${{ env.VERSION }}-arm64" \
            "ghcr.io/${REPO_LOWER}:${{ env.VERSION }}-amd64"

          if [ -n "$DH_USER" ]; then
            DH_USER_LOWER=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
            echo "==> Creating Docker Hub Multi-Arch Manifests..."
            
            docker buildx imagetools create -t "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}" \
              "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-arm64" \
              "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-amd64"

            docker buildx imagetools create -t "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:latest" \
              "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-arm64" \
              "${DH_USER_LOWER}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-amd64"
          fi

      - name: Sync Docker Hub Description & Overview
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASS" ]; then
            echo "Authenticating with Docker Hub API..."
            LOGIN_RESP=$(curl -s -X POST https://hub.docker.com/v2/users/login \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$DOCKER_USER\", \"password\": \"$DOCKER_PASS\"}")
            TOKEN=$(echo "$LOGIN_RESP" | jq -r .token)
            
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              echo "Updating Docker Hub overview and short description..."
              README_CONTENT=$(cat README.md)
              SHORT_DESC="Multi-Arch ImmortalWrt Docker Gateway with OpenClash, Mihomo & WireGuard"
              
              PAYLOAD=$(jq -n \
                --arg full "$README_CONTENT" \
                --arg short "$SHORT_DESC" \
                '{full_description: $full, description: $short}')
              
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH "https://hub.docker.com/v2/repositories/$DOCKER_USER/${{ env.IMAGE_NAME }}/" \
                -H "Authorization: JWT $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD")
              
              echo "Docker Hub update response: HTTP $HTTP_STATUS"
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "Docker Hub description synced successfully."
              else
                echo "Warning: Docker Hub update returned HTTP $HTTP_STATUS"
              fi
            else
              echo "Warning: Failed to obtain JWT token from Docker Hub API."
            fi
          fi
